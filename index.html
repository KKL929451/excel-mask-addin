<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <title>Readable Data Mask</title>
  <link rel="stylesheet" href="styles.css?v=4" />
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script defer src="codec.js?v=3"></script>
  <script defer src="app.js?v=4"></script>
</head>
<body>
  <main>
    <h1>Readable Data Mask</h1>

    <section class="status-card" aria-label="Current workbook status">
      <span class="status-label">STATUS</span>
      <strong id="workbook-status" data-state="CONNECTING" aria-live="polite">CONNECTING...</strong>
    </section>

    <div class="actions">
      <button id="apply" class="primary" type="button">Decrypt</button>
      <button id="lock" class="secondary" type="button">Encrypt</button>
    </div>

    <div id="status" class="alert" role="alert" hidden></div>
  </main>
</body>
</html>
